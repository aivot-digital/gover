# Local development stack for Prosuna. This setup uses plain HTTP, fixed development
# addresses, local mail capture, and intentionally simple credentials. Do not deploy it
# to a public or production environment.
#
# Create a .env file next to this file as described in README.md, then run
# `docker compose up -d` from this directory.
name: prosuna

services:
  # Prosuna backend API and the central network endpoint for the local stack.
  prosuna_api:
    image: ghcr.io/aivot-digital/gover-next:5.0.0-beta-131
    restart: unless-stopped
    command: serve
    depends_on:
      - prosuna_database
      - keycloak
      - clamav
      - redis
      - rabbitmq
      - mailpit
    environment:
      # Database connection. The password is read from the adjacent .env file.
      PROSUNA_SERVER_PORT: 9595
      PROSUNA_DB_HOST: prosuna_database
      PROSUNA_DB_PORT: 5432
      PROSUNA_DB_USERNAME: prosuna
      PROSUNA_DB_PASSWORD: ${PROSUNA_DB_PASSWORD}
      PROSUNA_DB_DATABASE: prosuna

      # Redis stores short-lived application data such as sessions and replay guards.
      PROSUNA_REDIS_HOST: redis
      PROSUNA_REDIS_PORT: 6379
      PROSUNA_REDIS_DATABASE: 0

      # All local mail is captured by Mailpit and is never delivered externally.
      PROSUNA_SMTP_HOST: mailpit
      PROSUNA_SMTP_PORT: 1025
      PROSUNA_SMTP_AUTH: false

      # RabbitMQ runs background jobs for Prosuna.
      PROSUNA_RABBITMQ_HOST: rabbitmq
      PROSUNA_RABBITMQ_PORT: 5672
      PROSUNA_RABBITMQ_USERNAME: prosuna
      PROSUNA_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      # ClamAV scans uploads. Gotenberg renders documents from the shared network
      # namespace and is therefore reached through localhost.
      PROSUNA_CLAM_HOST: clamav
      PROSUNA_CLAM_PORT: 3310
      PROSUNA_GOTENBERG_HOST: localhost
      PROSUNA_GOTENBERG_PORT: 3000

      # Browsers use the public Caddy URL; backend requests use the internal service URL.
      PROSUNA_KEYCLOAK_OIDC_HOSTNAME: http://localhost:9595/idp
      PROSUNA_KEYCLOAK_OIDC_INTERNAL_HOSTNAME: http://keycloak:8080
      PROSUNA_KEYCLOAK_OIDC_REALM: staff
      PROSUNA_KEYCLOAK_OIDC_FRONTEND_CLIENT_ID: app
      PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_ID: backend
      PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_SECRET: ${PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_SECRET}

      # These development secrets still need at least 32 characters because Prosuna
      # validates their length during startup.
      PROSUNA_SECRETS_KEY: ${PROSUNA_SECRETS_KEY}
      PROSUNA_CAPTCHA_KEY: ${PROSUNA_CAPTCHA_KEY}

      # Public application settings for the local Caddy endpoint.
      PROSUNA_HOSTNAME: http://localhost:9595
      PROSUNA_SUPPORT_URL: https://support.aivot.de
      PROSUNA_TIMEZONE: Europe/Berlin
      PROSUNA_FROM_MAIL: mail@example.com
      PROSUNA_REPORT_MAIL: mail@example.com
      PROSUNA_BOOTSTRAP_ADMIN_MAIL: admin@example.com
    volumes:
      - prosuna_data:/app/data
    networks:
      - prosuna
      - prosuna_keycloak
      - mail
      - proxy

  # Prosuna web application. Sharing the API network namespace makes both containers
  # available through the prosuna_api host while keeping their ports private.
  prosuna_app:
    image: ghcr.io/aivot-digital/gover-next:5.0.0-beta-131
    restart: unless-stopped
    command: web
    network_mode: "service:prosuna_api"
    depends_on:
      prosuna_api:
        condition: service_healthy
        restart: true
      gotenberg:
        condition: service_started
        restart: true
    environment:
      PROSUNA_HOSTNAME: http://localhost:9595

  # Persistent PostgreSQL database for Prosuna application data.
  prosuna_database:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PROSUNA_DB_PASSWORD}
      POSTGRES_USER: prosuna
      POSTGRES_DB: prosuna
      PGDATA: /var/lib/postgresql/data/pgdata
      PGTZ: Europe/Berlin
    volumes:
      - prosuna_database_data:/var/lib/postgresql/data
    networks:
      - prosuna

  # Development identity provider. start-dev and the fixed bootstrap credentials are
  # intentionally convenient and must never be copied to a production deployment.
  keycloak:
    image: ghcr.io/aivot-digital/keycloak-egov-plugins:26.6.4.3
    restart: unless-stopped
    depends_on:
      - keycloak_database
    command: start-dev
    environment:
      KC_HOSTNAME: http://localhost:9595/idp
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: bootstrap_admin
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_FEATURES: transient-users,update-email,hostname:v2
    networks:
      - keycloak
      - prosuna_keycloak
      - mail
      - proxy

  # Waits for Keycloak, then creates the Prosuna realms, clients, and managed admin.
  # The managed admin credentials come from .env; bootstrap_admin is only used during setup.
  keycloak_setup:
    image: ghcr.io/aivot-digital/keycloak-egov-plugins-setup:0.0.24
    restart: on-failure
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      HOSTNAME: http://localhost:9595
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: bootstrap_admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: bootstrap_admin
      KEYCLOAK_DEPLOYMENT_CLIENT_NAME: deployment
      KEYCLOAK_DEPLOYMENT_CLIENT_SECRET: ${KEYCLOAK_DEPLOYMENT_CLIENT_SECRET}
      KEYCLOAK_ADMIN_EMAIL: mail@example.com
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      LOGGING_LEVEL_HTTP: ERROR
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: mail@example.com
      SMTP_FROM_DISPLAY: ProsunaIDP
      BACKEND_CLIENT_SECRET: ${PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_SECRET}
    networks:
      - keycloak

  # Persistent PostgreSQL database used only by Keycloak.
  keycloak_database:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_database_data:/var/lib/postgresql/data
    networks:
      - keycloak

  # Antivirus service for uploaded files.
  clamav:
    image: docker.io/clamav/clamav:1.5.4-debian
    restart: unless-stopped
    networks:
      - prosuna

  # In-memory cache and short-lived application state.
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    networks:
      - prosuna

  # Document renderer. It shares the API network namespace so Chromium can load the
  # local Prosuna URL while all other private and public addresses remain denied.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    restart: unless-stopped
    network_mode: "service:prosuna_api"
    depends_on:
      prosuna_api:
        condition: service_started
        restart: true
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_ALLOW_LIST: "^(http://localhost:9595/|file:///tmp/)"

  # Local SMTP sink. Open http://localhost:9025 to inspect captured messages.
  mailpit:
    image: docker.io/axllent/mailpit:v1.30
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    ports:
      - "9025:8025"
    networks:
      - mail

  # Durable message broker for background jobs.
  rabbitmq:
    image: docker.io/library/rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: prosuna
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - prosuna

  # Local reverse proxy for the customer app, staff app, API, and Keycloak.
  # It exposes the complete stack at http://localhost:9595.
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      prosuna_api:
        condition: service_healthy
        restart: true
      prosuna_app:
        condition: service_healthy
        restart: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
    ports:
      - "9595:80"
    networks:
      - proxy


# Named volumes retain local data across container recreation. Remove them only when a
# complete reset of the local environment is intended.
volumes:
  prosuna_data:
  prosuna_database_data:
  keycloak_database_data:
  mailpit_data:
  rabbitmq_data:


# Networks keep databases and infrastructure services reachable only by the containers
# that need them. Only Caddy and Mailpit publish host ports.
networks:
  prosuna:
  keycloak:
  prosuna_keycloak:
  mail:
  proxy:

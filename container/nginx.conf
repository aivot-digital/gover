server {
    listen      8080;
    listen      [::]:8080;
    server_name default_server;
    server_tokens off;

    root  /app/www;
    index index.html;

    gzip       on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content Security Policy for the customer and staff entry documents, reported but not enforced yet, so violations
    # show in the browser console before the policy blocks anything. Scripts come only from the bundle and the
    # app-config.js of the API; the hash allows the inline AppConfig default in index.html and must be updated when that
    # script changes. Styles stay inline because MUI, MDXEditor and Monaco inject them at runtime. External sources:
    # OpenStreetMap tiles for the map input and the Prosuna marketplace.
    set $content_security_policy "default-src 'self'; script-src 'self' 'sha256-/ZM3rZmRED8bVuaRNzhe6KqlcBQdaTVHFyw6QXkIwWk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://marketplace.prosuna.de; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    # Only Vite's content-hashed JavaScript and CSS are immutable. Missing chunks
    # must return 404 instead of the SPA HTML, including after a deployment.
    location ~ "^/(staff/)?assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        try_files $uri =404;
        # Keep the original URI/MIME type and negotiate the build-generated .br sidecar.
        # "on" honors Accept-Encoding; "always" would break clients without Brotli.
        brotli_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /staff/assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sbom/manifest.json {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /sbom/ {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /staff {
        try_files  $uri /staff/index.html;
    }

    location / {
        try_files  $uri /index.html;
    }

    location /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy-Report-Only $content_security_policy always;
        internal; # This is important to allow the internal redirect to work
    }

    location /staff/index.html {
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy-Report-Only $content_security_policy always;
        internal; # This is important to allow the internal redirect to work
    }

    location = /security.txt {
        return 301 /.well-known/security.txt;
    }
}

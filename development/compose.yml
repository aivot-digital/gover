# -------------------------- Usage --------------------------
# Start this with: docker compose -f ./docker-compose.yml up -d
# -----------------------------------------------------------
name: prosuna_dev_environment

services:

  prosuna-database:
    image: docker.io/library/postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: prosuna
      POSTGRES_USER: prosuna
      POSTGRES_DB: prosuna
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prosuna_database_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  antivirus:
    image: docker.io/clamav/clamav:1.5.5-debian
    restart: unless-stopped
    ports:
      - "3310:3310"

  cache:
    image: docker.io/library/redis:8.12.0-alpine3.23
    restart: unless-stopped
    ports:
      - "6379:6379"

  pdf-printer:
    image: docker.io/gotenberg/gotenberg:8.40.0
    restart: unless-stopped
    network_mode: host
    environment:
      API_PORT: 9191
      # Like the examples, deny Chromium every URL except the local Prosuna URL and temporary render files.
      # Allow-list matches bypass the IP checks, so the local Prosuna URL stays reachable.
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_ALLOW_LIST: "^(http://localhost:9595/|file:///tmp/)"

  s3-object-storage:
    image: docker.io/chrislusf/seaweedfs:4.55
    restart: unless-stopped
    # Runs all SeaweedFS components in one process and creates the bucket on every start if it is missing.
    command: mini -dir=/data -bucket=prosuna -admin.password=adminpassword -master.telemetry=false
    environment:
      # Static admin identity for the S3 API. Configuring it also makes SeaweedFS reject unsigned requests.
      AWS_ACCESS_KEY_ID: super-access-key
      AWS_SECRET_ACCESS_KEY: super-secret-key
    volumes:
      - seaweedfs_data:/data
    ports:
      - "9000:8333"
      - "9001:12535"

  smtp:
    image: docker.io/axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    ports:
      - "9025:8025"
      - "2025:1025"

  keycloak-database:
    image: docker.io/library/postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_database_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: ghcr.io/aivot-digital/keycloak-egov-plugins:26.8.2.0
    restart: unless-stopped
    depends_on:
      - keycloak-database
    command: [ 'start-dev' ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: "http://localhost:9595/idp"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HOSTNAME_DEBUG: "true"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-database:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "keycloak"
      KC_FEATURES: "transient-users,update-email,hostname:v2"

  keycloak-setup:
    image: ghcr.io/aivot-digital/keycloak-egov-plugins-setup:0.0.30
    depends_on:
      - keycloak
    environment:
      ENVIRONMENT: development
      KEYCLOAK_URL: "http://keycloak:8080"
      HOSTNAME: "http://localhost:9595"
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KEYCLOAK_DEPLOYMENT_CLIENT_NAME: "deployment"
      KEYCLOAK_DEPLOYMENT_CLIENT_SECRET: "my-super-secret-key"
      KEYCLOAK_ADMIN_EMAIL: "mail@example.com"
      KEYCLOAK_ADMIN_USERNAME: "superuser"
      KEYCLOAK_ADMIN_PASSWORD: "My-Super-Secret-Password-No.1"
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      LOGGING_LEVEL_HTTP: "ERROR"
      SMTP_HOST: "smtp"
      SMTP_PORT: "1025"
      SMTP_USERNAME: "username"
      SMTP_PASSWORD: "my-super-secret-password"
      SMTP_FROM: "mail@example.com"
      SMTP_FROM_DISPLAY: "Mail Test"
      BACKEND_CLIENT_SECRET: "my-super-secret-key"

  message-broker:
    image: docker.io/library/rabbitmq:4.4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  reverse-proxy:
    image: docker.io/library/caddy:2.11.9-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      # Usually empty in development; generated or local bundles are served when present.
      - ../build/sbom:/srv/sbom:ro,Z
    ports:
      - "9595:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  # PostgreSQL 18 cannot open the data of the former PostgreSQL 16 volumes prosuna_pg_data and keycloak_pg_data.
  prosuna_database_data:
  keycloak_database_data:
  seaweedfs_data:
  mailpit_data:
  rabbitmq_data:

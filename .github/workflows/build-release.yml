name: Test the pull request, generate SBOMs, and build the library and container image for a full release.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verifyTagOnMain:
    name: Verify tag commit is on main
    runs-on: ubuntu-24.04
    outputs:
      is_on_main: ${{ steps.check.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether the tag commit is contained in main
        id: check
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release skipped::The tag commit is not contained in the main branch."
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  prepareBuildVars:
    name: Prepare build variables
    if: needs.verifyTagOnMain.outputs.is_on_main == 'true'
    needs:
      - verifyTagOnMain
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.build_date.outputs.value }}
      build_version: ${{ steps.build_version.outputs.value }}
      build_number: ${{ github.run_number }}
    steps:
      - name: Get current date
        id: build_date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Get the current build version based on the source branch
        id: build_version
        run: |
          build_version="${GITHUB_REF_NAME#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ "$build_version" =~ $semver_pattern ]]; then
            echo "value=$build_version" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Invalid build version::Computed build version '$build_version' is not valid SemVer. Falling back to 0.0.0."
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  testBackend:
    name: Test the backend code
    needs:
      - prepareBuildVars
    uses: ./.github/workflows/subflows/test-backend.yml
    permissions:
      contents: read
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}

  generateSbom:
    name: Generate SBOMs and verify license compliance
    needs:
      - prepareBuildVars
    uses: ./.github/workflows/subflows/generate-sbom.yml
    permissions:
      contents: read
      issues: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
      build_date: ${{ needs.prepareBuildVars.outputs.build_date }}
    secrets: inherit

  genrateLibrary:
    name: Generate the java library for the usage in plugins and other java applications
    needs:
      - prepareBuildVars
      - testBackend
      - generateSbom
    uses: ./.github/workflows/subflows/generate-library.yml
    permissions:
      contents: read
      packages: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
    secrets: inherit

  generateImage:
    name: Generate the container image for the deployment of the backend and frontend services
    if: needs.prepareBuildVars.outputs.build_version != '0.0.0'
    needs:
      - prepareBuildVars
      - testBackend
      - generateSbom
    uses: ./.github/workflows/subflows/generate-image.yml
    permissions:
      contents: read
      packages: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
      build_date: ${{ needs.prepareBuildVars.outputs.build_date }}
      build_number: ${{ needs.prepareBuildVars.outputs.build_number }}
      image_name: ${{ github.repository }}
      is_release: true
    secrets: inherit

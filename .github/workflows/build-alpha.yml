name: Test the pull request, generate SBOMs, and build the library and container image for an alpha release candidate.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - "milestone/*"
      - "patch/*"

jobs:
  prepareBuildVars:
    name: Prepare build variables
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      build_date: ${{ steps.build_date.outputs.value }}
      build_version: ${{ steps.build_version.outputs.value }}
      build_number: ${{ github.event.pull_request.number }}
    steps:
      - name: Get current date
        id: build_date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Get the current build version based on the target branch
        id: build_version
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          build_version="${TARGET_BRANCH##*/}-alpha-${PR_NUMBER}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ "$build_version" =~ $semver_pattern ]]; then
            echo "value=$build_version" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Invalid build version::Computed build version '$build_version' is not valid SemVer. Falling back to 0.0.0."
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  testBackend:
    name: Test the backend code
    if: github.event.pull_request.draft == false
    needs:
      - prepareBuildVars
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}

  generateSbom:
    name: Generate SBOMs and verify license compliance
    if: github.event.pull_request.draft == false
    needs:
      - prepareBuildVars
    uses: ./.github/workflows/generate-sbom.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
      build_date: ${{ needs.prepareBuildVars.outputs.build_date }}
    secrets: inherit

  genrateLibrary:
    name: Generate the java library for the usage in plugins and other java applications
    if: github.event.pull_request.draft == false
    needs:
      - prepareBuildVars
      - testBackend
      - generateSbom
    uses: ./.github/workflows/generate-library.yml
    permissions:
      contents: read
      packages: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
    secrets: inherit

  generateImage:
    name: Generate the container image for the deployment of the backend and frontend services
    if: github.event.pull_request.draft == false && needs.prepareBuildVars.outputs.build_version != '0.0.0'
    needs:
      - prepareBuildVars
      - testBackend
      - generateSbom
    uses: ./.github/workflows/generate-image.yml
    permissions:
      contents: read
      packages: write
    with:
      build_version: ${{ needs.prepareBuildVars.outputs.build_version }}
      build_date: ${{ needs.prepareBuildVars.outputs.build_date }}
      build_number: ${{ needs.prepareBuildVars.outputs.build_number }}
      image_name: ${{ github.repository_owner }}/gover-next
      is_release: false
    secrets: inherit

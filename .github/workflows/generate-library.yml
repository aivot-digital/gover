name: Build

on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string

jobs:
  publish:
    name: Build & Publish
    if: inputs.build_version != '0.0.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.2.0
          cache: npm
          cache-dependency-path: backend/mails/package-lock.json

      - name: Install mail template dependencies
        working-directory: backend/mails
        run: npm ci

      - name: Build mail templates
        working-directory: backend/mails
        run: npm run build:dev

      - name: Publish the package to the GitHub package registry
        working-directory: backend
        run: mvn --batch-mode deploy
        env:
          BUILD_VERSION: ${{ inputs.build_version }}-SNAPSHOT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

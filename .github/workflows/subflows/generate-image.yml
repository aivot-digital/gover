name: generateImage

on:
  workflow_call:
    inputs:
      build_date:
        required: true
        type: string
      build_version:
        required: true
        type: string
      build_number:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  buildArm64Image:
    name: Build ARM64 image and push preview/release when allowed
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      BUILD_DATE: ${{ inputs.build_date }}
      BUILD_VERSION: ${{ inputs.build_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      IMAGE_NAME: ${{ inputs.image_name }}
      CAN_PUSH_IMAGE: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Explain why image push is disabled
        if: env.CAN_PUSH_IMAGE != 'true'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::notice title=Image push skipped::Building the image for validation only. The pull request comes from '$HEAD_REPOSITORY', not '$BASE_REPOSITORY', so this run does not log in to GHCR or push packages."

      - name: Log in to the container registry
        if: env.CAN_PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download SBOM bundle
        uses: actions/download-artifact@v7
        with:
          name: sbom-bundle
          path: app/public/sbom/

      - name: Build image and push when allowed
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.CAN_PUSH_IMAGE == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_DATE=${{ env.BUILD_DATE }}

  buildAmd64Image:
    name: Build AMD64 image and push preview/release when allowed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BUILD_DATE: ${{ inputs.build_date }}
      BUILD_VERSION: ${{ inputs.build_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      IMAGE_NAME: ${{ inputs.image_name }}
      CAN_PUSH_IMAGE: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Explain why image push is disabled
        if: env.CAN_PUSH_IMAGE != 'true'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::notice title=Image push skipped::Building the image for validation only. The pull request comes from '$HEAD_REPOSITORY', not '$BASE_REPOSITORY', so this run does not log in to GHCR or push packages."

      - name: Log in to the container registry
        if: env.CAN_PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download SBOM bundle
        uses: actions/download-artifact@v7
        with:
          name: sbom-bundle
          path: app/public/sbom/

      - name: Build image and push when allowed
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.CAN_PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_DATE=${{ env.BUILD_DATE }}

  mergeImages:
    name: Merge ARM64 and AMD64 images and push to registry
    if: >
      inputs.build_version != '0.0.0' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BUILD_VERSION: ${{ inputs.build_version }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      IMAGE_NAME: ${{ inputs.image_name }}
    needs:
      - buildArm64Image
      - buildAmd64Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish manifest on GitHub Container Registry
        run: |
          docker buildx imagetools create \
          --append ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }}-arm64 \
          --append ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }}-amd64 \
          --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }} \
          $( [ "${IS_RELEASE}" = "true" ] && echo "--tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" )
        env:
          IS_RELEASE: ${{ inputs.is_release }}

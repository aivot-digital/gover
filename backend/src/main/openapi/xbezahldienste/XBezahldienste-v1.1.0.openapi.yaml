  parameters:
    OriginatorId:
      name: originatorId
      in: path
      description: Enthält die Kennung des auslösenden Online-Dienstes, z. B. den fachlichen Kontext.
      required: true
      example: "MELD-ANT-FORM-4711"
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: '^[\w\d-]+$'
    EndPointId:
      name: endPointId
      in: path
      description: Enthält ein weiteres Ordnungskriterium für die Identifikation der zuständigen Behörde, z. B. den AGS
      required: true
      example: "BERLIN"
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: '^[\w\d-]+$'
    TransactionId:
      name: transactionId
      in: path
      description: Vom Bezahldienst vergebene Transaktions-ID - kann auch das Kassenzeichen sein
      required: true
      example: "9xxd-432x-6543-xfd6-gfdx-fd27"
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: '^[\w\d-]+$'

  responses:

    200Healthy:
      description: "Erfolgsmeldung auf Statusabfrage"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SystemResponse'
          example:
            type: "https://docs.fitko.de/xbezahldienste/API-SystemResponse/#200healthy"
            status: 200
            title: "OK"
            detail: "Everything is up and running"

    400Error:
      description: Bad request - Syntaktischer oder semantischer Fehler
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SystemResponse'
          example:
            type: "https://docs.fitko.de/xbezahldienste/API-SystemResponse/#400error"
            status: 400
            title: "Bad Request"
            detail: "In den BookingData fehlen die für diesen Bezahldienst notwendigen Felder Kapitel, Titel, TitelKennz, TitelZusatz"
            functionalCode: "BOOKING_DATA_MISSING"

    403Error:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SystemResponse'
          example:
            type: "https://docs.fitko.de/xbezahldienste/API-SystemResponse/#403error"
            status: 403
            title: "Forbidden"
            detail: "Die Authentifzierung ist fehlgeschlagen."
            functionalCode: "FORBIDDEN"
    404Error:
      description: Not found
      content:
        application/problem+json:

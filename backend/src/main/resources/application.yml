# Build information
# These properties are replaced by the build process of the image
build:
  buildVersion: "@buildVersion"
  buildNumber: "@buildNumber"
  buildTimestamp: "@buildTimestamp"

spring:
  autoconfigure:
    # Remove the default UserDetailsService auto-configuration
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # Allow to load properties from /run/secrets/ directory
  # This is useful when using Docker secrets
  config:
    import: "optional:configtree:/run/secrets/"

  # Set the config for the database connection
  datasource:
    url: "jdbc:postgresql://${PROSUNA_DB_HOST}:${PROSUNA_DB_PORT}/${PROSUNA_DB_DATABASE}?stringtype=unspecified"
    username: "${PROSUNA_DB_USERNAME}"
    password: "${PROSUNA_DB_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"

    # Define the database connection pool properties
    hikari:
      minimum-idle: ${PROSUNA_DB_MIN_IDLE:5}
      maximum-pool-size: ${PROSUNA_DB_MAX_POOL_SIZE:10}
      # PostgreSQL current_date and timestamp rendering follow the session timezone.
      # Initialize every pooled connection explicitly so they cannot inherit a host default.
      connection-init-sql: "set time zone '${PROSUNA_TIMEZONE:Europe/Berlin}'"

  jpa:
    hibernate:
      # Prevent hibernate from modifying the database schema
      # This is handled by Flyway instead
      ddl-auto: validate
    # Close the hibernate session at the end of a transaction to prevent lazy loading issues
    open-in-view: true
    # Debug SQL
    # showSql: true
    # Pretty print SQL
    # properties:
    #   hibernate:
    #     format_sql: true
    #     # Use the PostgreSQL dialect
    #     dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        type:
          # Fix for Hibernate 6 to map Java Duration to PostgreSQL interval type
          preferred_duration_jdbc_type: INTERVAL_SECOND
        connection:
          url: "jdbc:postgresql://${PROSUNA_DB_HOST}:${PROSUNA_DB_PORT}/${PROSUNA_DB_DATABASE}?stringtype=unspecified"
          username: "${PROSUNA_DB_USERNAME}"
          password: "${PROSUNA_DB_PASSWORD}"
          autocommit: false
          isolation: TRANSACTION_REPEATABLE_READ
          pool_size: ${spring.datasource.hikari.maximum-pool-size}

  jackson:
    serialization:
      # Keep Instants on the HTTP API as ISO-8601 strings instead of numeric timestamps.
      write-dates-as-timestamps: false

  data:
    rest:
      # Set the default base path for the backend application
      basePath: /api
      # Disable the exposure of jpa repositories by default
      detection-strategy: annotated

    redis:
      host: "${PROSUNA_REDIS_HOST}"
      port: "${PROSUNA_REDIS_PORT}"
      database: "${PROSUNA_REDIS_DATABASE}"

  # Set the default upload size limits
  servlet:
    multipart:
      max-file-size: "${PROSUNA_MAX_UPLOAD_FILE:100MB}"
      max-request-size: "${PROSUNA_MAX_UPLOAD_TOTAL:500MB}"

  flyway:
    # Enable flyway for database migrations
    enabled: true
    # Add the option to allow flyway to operate on databases with some preexisting schema
    # This is useful when working with managed Azure PostgreSQL databases
    baselineVersion: ${PROSUNA_DB_BASELINE_VERSION:0}
    baselineOnMigrate: ${PROSUNA_DB_BASELINE_ON_MIGRATE:false}
    # Add the option to allow flyway to repair the migration checksums
    repairOnMigrate: ${PROSUNA_DB_REPAIR_ON_MIGRATE:false}
  # Set the properties for the mail server
  mail:
    host: ${PROSUNA_SMTP_HOST}
    port: ${PROSUNA_SMTP_PORT}
    username: ${PROSUNA_SMTP_USERNAME:}
    password: ${PROSUNA_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${PROSUNA_SMTP_AUTH:true}
          starttls:
            enable: ${PROSUNA_SMTP_TLS:true}

  security:
    # Configure oidc authentication details
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${PROSUNA_KEYCLOAK_OIDC_HOSTNAME}/realms/${PROSUNA_KEYCLOAK_OIDC_REALM}"
          jwk-set-uri: "${PROSUNA_KEYCLOAK_OIDC_INTERNAL_HOSTNAME:${PROSUNA_KEYCLOAK_OIDC_HOSTNAME}}/realms/${PROSUNA_KEYCLOAK_OIDC_REALM}/protocol/openid-connect/certs"

  rabbitmq:
    host: "${PROSUNA_RABBITMQ_HOST}"
    port: "${PROSUNA_RABBITMQ_PORT}"
    username: "${PROSUNA_RABBITMQ_USERNAME}"
    password: "${PROSUNA_RABBITMQ_PASSWORD}"

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /api/actuator
      exposure:
        include: "*"

  endpoint:
    health:
      access: read_only
      show-details: when_authorized

  health:
    diskspace:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

server:
  port: "${PROSUNA_SERVER_PORT:8080}"
  error:
    whitelabel:
      enabled: false
    #include-message=always
    #include-binding-errors=always
    #include-stacktrace=ON_PARAM
    #include-exception=true

# Set the properties for the logging
logging:
  level:
    root: "${PROSUNA_LOG_LEVEL:INFO}"
  structured:
    format:
      console: "${PROSUNA_LOG_FORMAT:}"

# Set the properties for the ClamAV server
clam:
  host: "${PROSUNA_CLAM_HOST}"
  port: "${PROSUNA_CLAM_PORT}"
  timeout: 20000

# Set the properties for the Gotenberg server
gotenberg:
  host: "${PROSUNA_GOTENBERG_HOST}"
  port: "${PROSUNA_GOTENBERG_PORT}"

# Set the encryption key for the secrets
secrets:
  key: "${PROSUNA_SECRETS_KEY}"

# Set the encryption key for captcha challenges
captcha:
  key: "${PROSUNA_CAPTCHA_KEY}"

# Set basic properties for the prosuna business case
prosuna:
  prosunaHostname: "${PROSUNA_HOSTNAME}"
  timezone: "${PROSUNA_TIMEZONE:Europe/Berlin}"
  fromMail: "${PROSUNA_FROM_MAIL}"
  reportMail: "${PROSUNA_REPORT_MAIL}"
  sentryServer: "${PROSUNA_SENTRY_SERVER:}"
  sentryWebApp: "${PROSUNA_SENTRY_WEB_APP:}"
  environment: "${PROSUNA_ENVIRONMENT:}"
  departmentLevelLabels: "${PROSUNA_DEPARTMENT_LEVEL_LABELS:Organisation,Bereich,Abteilung,Sachgebiet,Arbeitsbereich}"
  security:
    csrfTtlSeconds: "${PROSUNA_CSRF_TTL_SECONDS:86400}"
  search:
    recent:
      max-items-per-user: "${PROSUNA_SEARCH_RECENT_MAX_ITEMS_PER_USER:50}"
      retention-days: "${PROSUNA_SEARCH_RECENT_RETENTION_DAYS:90}"
  http:
    connectionTimeoutSeconds: "${PROSUNA_HTTP_CONNECTION_TIMEOUT_SECONDS:2}"
    readTimeoutSeconds: "${PROSUNA_HTTP_READ_TIMEOUT_SECONDS:60}"
  ai:
    defaultMaxTokens: "${PROSUNA_AI_DEFAULT_MAX_TOKENS:1000}"
    completion:
      maxTokens: "${PROSUNA_AI_COMPLETION_MAX_TOKENS:1000}"
    processDataTransformation:
      maxTokens: "${PROSUNA_AI_PROCESS_DATA_TRANSFORMATION_MAX_TOKENS:4000}"
  fileExtensions: "${PROSUNA_FILE_EXTENSIONS:pdf,png,jpg,jpeg,doc,docx,xls,xlsx,ppt,pptx,odt,fodt,ods,fods,odp,fodp,odg,fodg,odf}"
  contentTypes: "${PROSUNA_CONTENT_TYPES:application/pdf,image/png,image/jpeg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msexcel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/mspowerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.presentation,application/vnd.oasis.opendocument.graphics,application/vnd.oasis.opendocument.formula}"
  maxSubmissionCopyRetryCount: 3
  bootstrapAdminMail: "${PROSUNA_BOOTSTRAP_ADMIN_MAIL:}"
  registryHostname: "${PROSUNA_TEMPLATE_REGISTRY_URL:}"
  moduleFlags: "${PROSUNA_MODULE_FLAGS:form,process,portal}"
  processNodeLimits:
    trigger: "${PROSUNA_PROCESS_NODE_LIMITS_TRIGGERS:1}"
    action: "${PROSUNA_PROCESS_NODE_LIMITS_ACTIONS:4}"
    flowControl: "${PROSUNA_PROCESS_NODE_LIMITS_FLOWS:0}"
    termination: "${PROSUNA_PROCESS_NODE_LIMITS_TERMINATIONS:-1}"

# Configure the details for fetching, managing and updating the prosuna user data from keycloak
keycloak:
  hostname: "${PROSUNA_KEYCLOAK_OIDC_HOSTNAME}"
  internalHostname: "${PROSUNA_KEYCLOAK_OIDC_INTERNAL_HOSTNAME:${PROSUNA_KEYCLOAK_OIDC_HOSTNAME}}"
  realm: "${PROSUNA_KEYCLOAK_OIDC_REALM}"
  frontendClientId: "${PROSUNA_KEYCLOAK_OIDC_FRONTEND_CLIENT_ID}"
  frontendClientSecret: "${PROSUNA_KEYCLOAK_OIDC_FRONTEND_CLIENT_SECRET:}"
  backendClientId: "${PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_ID}"
  backendClientSecret: "${PROSUNA_KEYCLOAK_OIDC_BACKEND_CLIENT_SECRET}"

# Configure the storage provider plugins
storage:
  local:
    v1:
      allowed-local-roots: "${PROSUNA_STORAGE_LOCAL_ALLOWED_ROOTS:./data}"

# Configure the openapi documentation for the backend application
springdoc:
  apiDocs:
    path: "/api/public/docs/openapi.json"
    enabled: "${PROSUNA_ENABLE_API_DOCS:false}"
  swaggerUi:
    path: "/api/public/docs/swagger.html"
    enabled: "${PROSUNA_ENABLE_API_UI:false}"
  showActuator: true

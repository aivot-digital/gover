<!--/*@thymesVar id="base" type="de.aivot.prosuna.backend.pdf.models.FormPdfContext"*/-->
<!--/*@thymesVar id="element" type="de.aivot.prosuna.backend.elements.models.elements.form.input.ContactInputElement"*/-->
<div class="input-element text-element">
    <div class="input">
        <div class="label">
            <strong th:text="${element.label}"></strong>
            <span th:if="${base.isBlankPrint() && element.required}">(Pflichtangabe)</span>
        </div>
        <div class="content">
            <span th:if="${base.isNotBlankPrint()}" th:text="${element.toDisplayValue(value)}"></span>
        </div>
    </div>
    <div class="hint-wrapper"><div th:insert="~{./form-parts/elements/_hint.html}"></div></div>
</div>
